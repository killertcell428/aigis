[build-system]
requires = ["hatchling>=1.31.0,<1.32"]
build-backend = "hatchling.build"

[project]
name = "pyaigis"
version = "1.1.11"
description = "Open-source trust layer for adopting Claude Code and autonomous AI agents at work: deterministic guardrails on every tool call, tamper-evident audit logs, and a generated IT-approval pack (aigis trust-pack). Zero-dependency Python firewall — prompt injection, MCP tool poisoning, memory defense; 44 compliance templates across US/CN/JP/EU. Library, Docker sidecar, or CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "llm", "security", "prompt-injection", "ai-safety",
    "pii", "jailbreak", "guardrails", "owasp",
    "ai-agent", "governance", "middleware", "fastapi",
    "langchain", "openai", "anthropic", "mcp",
    "mcp-security", "red-team", "mitre-atlas",
    "ai-firewall", "agent-security", "aigis",
    "claude-code", "audit-log", "ai-governance",
    "devsecops", "compliance", "trust-layer",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
# Zero required dependencies for the core library
dependencies = []

[project.optional-dependencies]
# YAML-based policy files
yaml = ["pyyaml>=6.0.3"]

# FastAPI / Starlette middleware
fastapi = ["fastapi>=0.141.1", "starlette>=1.3.1"]

# LangChain callback
langchain = ["langchain-core>=0.1.0"]

# OpenAI proxy wrapper
openai = ["openai>=2.45.0"]

# Anthropic SDK integration
anthropic = ["anthropic>=0.120.2"]

# Full SaaS server (backend + all integrations)
server = [
    "pyaigis[yaml,fastapi,openai]",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.1",
    "redis>=8.0.1",
    "structlog>=26.1.0",
    "stripe>=15.4.0",
    "reportlab>=5.0.0",
    "openpyxl>=3.1.5",
]

# Everything
all = ["pyaigis[yaml,fastapi,langchain,openai,anthropic]"]

# Development
dev = [
    "pyaigis[all]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "anyio>=4.14.2",
    "ruff>=0.16.1",
    "mypy>=2.2.0",
]

[project.scripts]
aigis = "aigis.cli:main"

[project.urls]
Homepage = "https://github.com/killertcell428/aigis"
Documentation = "https://github.com/killertcell428/aigis#readme"
Issues = "https://github.com/killertcell428/aigis/issues"
Changelog = "https://github.com/killertcell428/aigis/releases"

[tool.hatch.build.targets.wheel]
packages = ["aigis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
per-file-ignores = { "aigis/decoders.py" = ["E501"], "aigis/monitor/__init__.py" = ["E402"], "aigis/filters/*.py" = ["E501"], "aigis/patterns.py" = ["E501"], "aigis/similarity.py" = ["E501"], "aigis/badge.py" = ["E501"], "aigis/cli.py" = ["E501", "F401"], "aigis/activity.py" = ["E501"], "aigis/compliance.py" = ["E501"], "aigis/scanner.py" = ["E501"], "aigis/mcp_scanner.py" = ["E501"], "aigis/weekly_report.py" = ["E501"], "aigis/trust_pack.py" = ["E501"], "aigis/multi_agent/message_scanner.py" = ["E501"], "aigis/cross_session/sleeper.py" = ["E501"], "aigis/cross_session/correlator.py" = ["E501"], "aigis/adversarial_loop.py" = ["E501"], "aigis/auto_fix.py" = ["E501"], "aigis/benchmark.py" = ["E501"], "aigis/redteam.py" = ["E501"], "aigis/report.py" = ["E501"], "aigis/monitor/*.py" = ["E501"], "aigis/aep/*.py" = ["E501"], "aigis/spec_lang/*.py" = ["E501"], "aigis/audit/*.py" = ["E501"], "aigis/supply_chain/*.py" = ["E501"], "aigis/capabilities/*.py" = ["E501"], "aigis/memory/*.py" = ["E501"], "aigis/middleware/*.py" = ["E501"], "tests/*.py" = ["E501"] }

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_any_generics = false
