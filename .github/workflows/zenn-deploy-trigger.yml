name: Trigger Zenn Deploy

on:
  schedule:
    - cron: '0 23 6 4 *'

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trigger Zenn deploy with empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: trigger Zenn deploy for guideline-v12 article"
          git push
