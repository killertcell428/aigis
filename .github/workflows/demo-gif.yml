name: Demo GIF

# Manually-triggered: renders docs/demo/aigis-demo.tape into a GIF with VHS
# (in a clean Linux runner where the published aigis CLI works), then opens a
# PR with the regenerated GIF. Keeps the demo asset reproducible instead of a
# hand-recorded one-off.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install aigis (real CLI, from source)
        run: pip install -e .

      - name: Install ffmpeg, ttyd, VHS
        # Install the toolchain directly rather than via vhs-action, whose
        # bundled ffmpeg installer is flaky on GitHub runners.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          curl -fsSL https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz -o /tmp/vhs.tgz
          mkdir -p /tmp/vhs && tar -xzf /tmp/vhs.tgz -C /tmp/vhs
          sudo mv "$(find /tmp/vhs -type f -name vhs | head -1)" /usr/local/bin/vhs
          sudo chmod +x /usr/local/bin/vhs
          ffmpeg -version | head -1; ttyd --version; vhs --version

      - name: Render tape → GIF
        run: vhs docs/demo/aigis-demo.tape

      - name: Open PR with the regenerated GIF
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: chore/demo-gif-render
          title: "docs: regenerate aigis demo GIF (VHS)"
          commit-message: "docs: regenerate aigis demo GIF via VHS"
          body: |
            Auto-generated by the **Demo GIF** workflow from
            `docs/demo/aigis-demo.tape`.

            Once merged, embed it with:

            ```html
            <img src="https://raw.githubusercontent.com/killertcell428/aigis/master/docs/demo/aigis-demo.gif" width="760" />
            ```
          add-paths: docs/demo/aigis-demo.gif
          signoff: true
