name: Demo GIF

# Manually-triggered: renders a VHS tape into a GIF
# (in a clean Linux runner where the published aigis CLI works), then opens a
# PR with the regenerated GIF. Keeps the demo asset reproducible instead of a
# hand-recorded one-off.

on:
  workflow_dispatch:
    inputs:
      tape:
        description: "Tape to render (path from the repo root)"
        required: false
        default: docs/demo/aigis-demo.tape
        type: choice
        options:
          - docs/demo/aigis-demo.tape
          - docs/demo/aigis-profile.tape

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit the rendered GIF
      pull-requests: write   # open the PR with it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install aigis (real CLI, from source)
        run: pip install -e .

      - name: Install ffmpeg, ttyd, VHS
        # Install the toolchain directly rather than via vhs-action, whose
        # bundled ffmpeg installer is flaky on GitHub runners.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          curl -fsSL https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz -o /tmp/vhs.tgz
          mkdir -p /tmp/vhs && tar -xzf /tmp/vhs.tgz -C /tmp/vhs
          sudo mv "$(find /tmp/vhs -type f -name vhs | head -1)" /usr/local/bin/vhs
          sudo chmod +x /usr/local/bin/vhs
          ffmpeg -version | head -1; ttyd --version; vhs --version

      - name: Render tape → GIF
        id: render
        env:
          TAPE: ${{ inputs.tape || 'docs/demo/aigis-demo.tape' }}
        run: |
          set -euo pipefail
          test -f "$TAPE" || { echo "::error::tape not found: $TAPE"; exit 1; }

          # Read the output path out of the tape rather than assuming it. The PR
          # step needs the exact path: create-pull-request only stages what
          # add-paths names, so a hard-coded path silently drops the new GIF and
          # reports "no changes" while the render itself succeeded.
          GIF=$(awk '/^Output[[:space:]]+/{print $2; exit}' "$TAPE")
          test -n "$GIF" || { echo "::error::no Output line in $TAPE"; exit 1; }

          vhs "$TAPE"

          test -s "$GIF" || { echo "::error::render produced no file at $GIF"; exit 1; }
          echo "gif=$GIF" >> "$GITHUB_OUTPUT"
          echo "Rendered $GIF ($(du -h "$GIF" | cut -f1))"

      - name: Open PR with the regenerated GIF
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: chore/demo-gif-render-${{ hashFiles(inputs.tape || 'docs/demo/aigis-demo.tape') }}
          title: "docs: regenerate aigis demo GIF (VHS)"
          commit-message: "docs: regenerate aigis demo GIF via VHS"
          body: |
            Auto-generated by the **Demo GIF** workflow from
            `${{ inputs.tape || 'docs/demo/aigis-demo.tape' }}`.

            Once merged, embed it with:

            ```html
            <img src="https://raw.githubusercontent.com/killertcell428/aigis/master/${{ steps.render.outputs.gif }}" width="760" />
            ```
          add-paths: ${{ steps.render.outputs.gif }}
          signoff: true
