name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"  # alpha/beta tags

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt-in to Node.js 24 runners

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for Sigstore keyless signing of build provenance
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev-tag: ${{ steps.prev-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0          # full history for changelog generation

      - name: Reject orphan tags (must be reachable from master)
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/master. Refusing to publish a release from an orphan commit. Merge the release commit to master first, then tag the master commit."
            exit 1
          fi

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Find previous tag
        id: prev-tag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install build tools
        run: uv pip install --system 'build==1.5.0'

      - name: Build wheel + sdist
        run: python -m build

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Sign distributions with cosign (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # cosign v3 deprecated --output-signature / --output-certificate in
          # favour of a single --bundle file. The bundles MUST live outside
          # dist/ — pypa/gh-action-pypi-publish runs metadata verification on
          # every file in dist/ and rejects unknown extensions (the v1.1.4
          # first re-run failed with "InvalidDistribution: Unknown
          # distribution format: pyaigis-1.1.4-py3-none-any.whl.cosign.bundle").
          mkdir -p dist-signatures
          for artifact in dist/*; do
            base=$(basename "${artifact}")
            cosign sign-blob --yes \
              --bundle "dist-signatures/${base}.cosign.bundle" \
              "${artifact}"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-signatures
          path: dist-signatures/

  # ── 2. Publish to PyPI ────────────────────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/pyaigis

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        # No username/password needed — uses OIDC trusted publishing.
        # Configure at: https://pypi.org/manage/project/pyaigis/settings/publishing/

  # ── 3. GitHub Release with auto-changelog ─────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release creation

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        env:
          PREV_TAG: ${{ needs.build.outputs.prev-tag }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Group commits by conventional-commit prefix
          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges \
            --grep="^feat" | head -20)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges \
            --grep="^fix" | head -20)
          OTHERS=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges \
            --invert-grep --grep="^feat\|^fix\|^chore\|^ci\|^docs" | head -10)

          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$FEATURES" ]; then
              echo "### New Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### Other Changes"
              echo "$OTHERS"
              echo ""
            fi
            echo "### Installation"
            echo '```bash'
            echo "pip install pyaigis==${{ needs.build.outputs.version }}"
            echo '```'
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/killertcell428/aigis/compare/${PREV_TAG}...${VERSION}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-files/

      - name: Download signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-signatures
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "aigis ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.body }}
          files: release-files/*
          make_latest: true
          generate_release_notes: true   # appends GitHub auto-notes after our body
