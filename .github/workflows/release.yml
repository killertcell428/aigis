name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"  # alpha/beta tags

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt-in to Node.js 24 runners

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for Sigstore keyless signing of build provenance
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev-tag: ${{ steps.prev-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0          # full history for changelog generation

      - name: Reject orphan tags (must be reachable from master)
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/master. Refusing to publish a release from an orphan commit. Merge the release commit to master first, then tag the master commit."
            exit 1
          fi

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Find previous tag
        id: prev-tag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install build tools
        run: uv pip install --system 'build==1.5.0'

      - name: Build wheel + sdist
        run: python -m build

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/*"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Sign distributions with cosign (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # cosign v3 deprecated --output-signature / --output-certificate in
          # favour of a single --bundle file containing both the signature and
          # the Sigstore certificate. The v1.1.4 release run failed on the
          # legacy flags ("create bundle file: open : no such file or directory").
          for artifact in dist/*; do
            cosign sign-blob --yes \
              --bundle "${artifact}.cosign.bundle" \
              "${artifact}"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  # ── 2. Publish to PyPI ────────────────────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/pyaigis

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        # No username/password needed — uses OIDC trusted publishing.
        # Configure at: https://pypi.org/manage/project/pyaigis/settings/publishing/

  # ── 3. GitHub Release with auto-changelog ─────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release creation

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        env:
          PREV_TAG: ${{ needs.build.outputs.prev-tag }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Group commits by conventional-commit prefix
          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges \
            --grep="^feat" | head -20)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges \
            --grep="^fix" | head -20)
          OTHERS=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges \
            --invert-grep --grep="^feat\|^fix\|^chore\|^ci\|^docs" | head -10)

          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$FEATURES" ]; then
              echo "### New Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### Other Changes"
              echo "$OTHERS"
              echo ""
            fi
            echo "### Installation"
            echo '```bash'
            echo "pip install pyaigis==${{ needs.build.outputs.version }}"
            echo '```'
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/killertcell428/aigis/compare/${PREV_TAG}...${VERSION}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: "aigis ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          make_latest: true
          generate_release_notes: true   # appends GitHub auto-notes after our body
