# Manual sync: Zenn articles (articles/) → Qiita (public/) → publish
# Disabled auto-trigger: QIITA_TOKEN secret is unset, so run on demand only.
name: Sync Zenn to Qiita

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Sync Zenn → Qiita format
        run: python scripts/sync_zenn_to_qiita.py --apply

      - name: Check for changes
        id: changes
        run: |
          # `git diff --quiet` ignores untracked files, so newly-created
          # public/*.md did not count as "changes" and the commit step was
          # skipped. `git status --porcelain public/` catches both tracked
          # modifications and new untracked files.
          if [ -n "$(git status --porcelain public/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced articles
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "sync: auto-sync Zenn articles to Qiita format"
          git push

      - name: Publish to Qiita
        if: steps.changes.outputs.changed == 'true'
        uses: increments/qiita-cli/actions/publish@3d1289cc1b48fd3d6cd4c7e5dde9745292997046 # v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
