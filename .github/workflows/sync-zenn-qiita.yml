# Manual sync: Zenn articles (articles/) → Qiita (public/) → publish
# Disabled auto-trigger: QIITA_TOKEN secret is unset, so run on demand only.
name: Sync Zenn to Qiita

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Sync Zenn → Qiita format
        run: python scripts/sync_zenn_to_qiita.py --apply

      - name: Check for changes
        id: changes
        run: |
          # `git diff --quiet` ignores untracked files, so newly-created
          # public/*.md did not count as "changes" and the commit step was
          # skipped. `git status --porcelain public/` catches both tracked
          # modifications and new untracked files.
          if [ -n "$(git status --porcelain public/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced articles
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "sync: auto-sync Zenn articles to Qiita format"
          git push

      - name: Publish to Qiita
        if: steps.changes.outputs.changed == 'true'
        uses: increments/qiita-cli/actions/publish@c5c11382f16e527709ae36ce4d9c6c2bd8c09a59 # v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
